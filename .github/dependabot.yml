version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Revisit alongside a faster-whisper upgrade that supports PyAV's new API.
    ignore:
      - dependency-name: av
        versions: [">=19"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
